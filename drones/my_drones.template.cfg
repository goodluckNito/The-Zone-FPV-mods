; drones - the drones added to the game's list.
;
; drones makes my_drones.cfg from this file the first time it runs and
; never touches it after that, so what you write in my_drones.cfg stays
; through updates. Each block here is added; save, then restart the game.
; drones/status.txt says what was added, and why anything was left out.
; A BETAFPV Meteor75 Pro II is at the end, ready to add: take the "; " off
; its lines.
;
; One [block] per drone. The [name] in brackets is its id: lowercase letters,
; digits and _ only, different from the game's own drones. It appears after
; the game's drones in the drone list (Pause > Next/Previous drone).
;
; Only base= is needed; everything you leave out comes from the base drone.
; Text goes in "quotes", numbers and true/false do not.
;
;   base="85mm_freestyle"   the game drone to build on: its 3D body, collision
;                           shape and sound, and every setting you leave out.
;                           5in_freestyle, 3.5in_freestyle, 2.5in_freestyle,
;                           85mm_freestyle, 65mm_freestyle,
;                           beginner_5_in_quad, 5in_racer
;   name="My Whoop"         shown in the drone list
;   description="..."       shown under the name
;
; Flight - the same values as the game's Physics menu:
;   weight=42               all-up weight in grams, battery included - it
;                           matters: a few grams change how it flies
;   thrust=266              all the motors' thrust at full throttle, grams:
;                           the maker's thrust-to-weight ratio times the
;                           weight (the Physics menu shows the ratio). The
;                           game's own drones are on the same scale.
;   top_speed=50            km/h - how fast the air through the props can go
;                           before they stop pushing: sets the top speed
;   drag_left_right=100     drag, in percent of the base drone's, when moving
;   drag_top_bottom=100       sideways, up and down, and forwards; smaller =
;   drag_front_back=100       slipperier (a smaller frame, no ducts)
;   camera_angle=25         camera uptilt, degrees
;   camera_fov=123          the game's camera FOV setting
;   camera_fisheye=90       the game's fisheye strength, 0-100
;
; Flight - values the game keeps inside each drone (the base drone's unless
; you set them):
;   rotation=0.2            how much torque the motors have to turn the drone:
;                           65mm 0.15, 85mm and 2.5" 0.2, 3.5" 0.4, 5" 1;
;                           higher = the rates are reached sooner
;   turtle=0.04             torque in turtle mode (65mm 0.01, 85mm 0.04)
;   corner_drag=0.6         extra drag from the spinning props, at full rpm
;                           (whoops 0.6, the rest 0.8)
;   idle_rpm=1200           motor rpm at zero throttle while armed
;   sound_pitch=0.2         motor sound pitch, added to the game's
;
; Battery - used by battery_sag (and by fpv_osd's readout if battery_sag is
; not installed); without these the base drone's pack in
; battery_sag/settings.cfg is used:
;   battery_mah=550         pack size
;   battery_cells=1         cells in series
;   battery_lihv=true       true = LiHV (4.35 V a cell full), false = LiPo
;   battery_full_throttle_amps=26   the whole drone's draw at full thrust
;   battery_idle_amps=0.9   flight controller, receiver, camera and VTX
;   battery_resistance_mohm=22      a cell and its lead; higher = more sag
;
; Props and motors - used by rotor_drag, dirty_air, motor_response and
; flight_controller; without these the base drone's in
; drones/settings.cfg are used:
;   prop_mm=46              prop diameter in mm
;   ducted=true             true = in ducts (a whoop or cinewhoop)
;   wheelbase_mm=80         diagonal motor-to-motor distance in mm
;   motor_ms=30             the motors' time constant: ms to close 63% of a
;                           throttle change
;
; OSD - used by fpv_osd:
;   craft_name="NITO"       shown at the bottom centre when you fly this drone
;                           (fpv_osd's own craft_name for the others)
;
;   hide=true               leave this drone out without deleting its block
;
; ---- Drones ready to add ----
; Take the "; " off the start of each line of a block - from its [name]
; down - save, and restart the game.

; BETAFPV Meteor75 Pro II (analog): 80mm 1S whoop, 1102 21000KV motors,
; Gemfan 1811 3-blade props, on a LAVA II 1S 580 mAh LiHV. 27.98 g dry plus
; the 14.1 g pack is 42 g; BETAFPV rates it at 6.33:1 thrust to weight with
; that pack, so 266 g of thrust - on the same scale as the game's own 65mm
; Whoop, whose 160 g matches the maker's figure for its 0702 30000KV class.
; Built on the game's 85mm Whoop (its body and sound), with 10% less drag and
; a lower camera. top_speed - the air speed through the props at which they
; have lost half their push - is 65 km/h: at full throttle its 1102 motors
; turn about 70,000 rpm on 1.8" props of about 1" pitch, and speed up as the
; props unload, so a punch keeps pulling as it climbs (at the 85mm Whoop's
; 50 it faded early). Hovers at about 30% throttle on a fresh pack. With
; battery_sag: about 10 minutes hovering (BETAFPV says 10:30), 5 flown hard.
; On a 680 mAh pack: weight=44 and battery_mah=680.
; [meteor75_pro_ii]
; name="Meteor75 Pro II"
; description="80mm 1S whoop, 1102 motors (BETAFPV Meteor75 Pro II)"
; base="85mm_freestyle"
; weight=42
; thrust=266
; top_speed=65
; drag_left_right=90
; drag_top_bottom=90
; drag_front_back=90
; camera_angle=20
; battery_mah=580
; battery_cells=1
; battery_lihv=true
; battery_full_throttle_amps=26
; battery_idle_amps=0.9
; battery_resistance_mohm=22
; prop_mm=46
; ducted=true
; wheelbase_mm=80
; motor_ms=30
