; drones 1.0 - settings.
; Change a value, save, restart the game - or change it in Pause > Mods with
; mod_settings. Delete a line to use the default. Updates keep what you
; change here (settings.default.cfg has the defaults). drones/status.txt
; shows what was added and each drone's figures.

; Every drone's props, frame and motors, in one place: rotor_drag, dirty_air,
; motor_response and flight_controller all read them from here.

; Drones you add are set up in my_drones.cfg (see README.txt) and are in the
; list here too, with all their settings. A BETAFPV Meteor75 Pro II comes in
; it commented out: take the "; " off its lines and restart to add it. An
; added drone takes these figures from the drone it is built on for anything
; its block leaves out.

; 65mm Whoop - 0702 motors, 31 mm props in ducts.
[65mm_freestyle]

; Prop diameter, mm.
prop_mm=31

; true = the props are in ducts (a whoop or cinewhoop).
ducted=true

; Motor to motor, diagonally across the frame, mm.
wheelbase_mm=65

; The motors' time constant: ms to close 63% of a throttle change (95%
; takes three times as long). Measured: 39 ms for a 5.1" prop on a 2306
; motor, about 26-40 ms for 3" to 5" racers; the whoops' are estimates from
; their lighter props.
motor_ms=25

; 85mm Whoop - 1102 motors, 40 mm props in ducts.
[85mm_freestyle]
prop_mm=40
ducted=true
wheelbase_mm=85
motor_ms=30

; 2.5" Freestyle - 2.5" props, open.
[2.5in_freestyle]
prop_mm=64
ducted=false
wheelbase_mm=115
motor_ms=28

; 3.5" Freestyle - 3.5" props, open (motors between the measured 3" and 5").
[3.5in_freestyle]
prop_mm=89
ducted=false
wheelbase_mm=150
motor_ms=32

; 5" Freestyle - 5" props, open; motors measured on a 5.1" prop and 2306.
[5in_freestyle]
prop_mm=127
ducted=false
wheelbase_mm=225
motor_ms=40

; Beginner 5" - 5" props, open; lower-kv motors.
[beginner_5_in_quad]
prop_mm=127
ducted=false
wheelbase_mm=225
motor_ms=45

; 5" Racer - 5" props, open, a tighter frame.
[5in_racer]
prop_mm=127
ducted=false
wheelbase_mm=215
motor_ms=40

; Any other quad.
[other]
prop_mm=40
ducted=true
wheelbase_mm=75
motor_ms=30
