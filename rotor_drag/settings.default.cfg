; rotor_drag 1.1 - settings.
; Change a value, save, restart the game. Delete a line to use the default.
; Updates keep what you change here (settings.default.cfg has the defaults).
; rotor_drag/status.txt shows the drone in use and its rotor drag.

[mod]

; false = turn rotor_drag off: the game runs as if it were not installed.
enabled=true

[rotor_drag]

; How strong the rotor drag is. 1 = as worked out from each drone's props
; (prop_mm and ducted in drones/settings.cfg, shared with the other
; mods); 0 = none; 2 = twice that (the 1.0 release's strength for ducts).
; From 14 km/h, flown level and let go, the game's 65mm Whoop coasts about
; 6 m before it is down to half speed; with 1, about 3.9 m; with 2, about
; 2.5 m. Stops shorter than your real quad? Lower it.
strength=1.0

; The physics engine's own slowdown of the quad, as a share of its speed
; each second. Godot slows every moving body by 0.1 of its speed a second
; unless a game sets it otherwise, and The Zone FPV leaves it: a drag no
; real quad has, on top of the air's, which takes the weight out of falls
; and long coasts. 0 = none, as in the air; 0.1 = the game as it is.
engine_damping=0.0
