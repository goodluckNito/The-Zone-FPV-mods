; dirty_air 1.0 - settings.
; Change a value, save, restart the game. Delete a line to use the default.
; Updates keep what you change here (settings.default.cfg has the defaults).
; dirty_air/status.txt shows the drone in use and where its prop wash starts.

[mod]

; false = turn dirty_air off: the game runs as if it were not installed.
enabled=true

[dirty_air]

; Falling into the air the props have pushed down: a little more thrust
; falling slowly, then - at about 0.75 to 1.8 times the props' hover wake
; speed - a loss of about 30% and a fluctuating, uneven thrust that bobs and
; rocks the quad. 1 = as measured on small props; 0 = none (the game gives
; the same thrust falling as hovering).
descent=1.0

; The air the quad leaves behind: hovering, punching or turning, the props
; leave a column of air going the other way, which spreads and slows over a
; second or two (less of it the faster you fly). Flying back into it -
; diving down after a punch, turning back through where you hovered - its
; flow and gusts change each prop's thrust: the quad loses lift, bobs, and
; with the flight_controller mod on, shakes. 1 = as worked out; 0 = none.
wake=1.0

; How much each prop's thrust comes and goes in dirty air - in its own ring
; wake and in the gusts of the air left behind - without changing how much
; lift is lost on average. 1 = as measured on small props at fixed rpm
; (about 17% at the worst of the ring state); measurements on bigger rotors
; go to two or three times that. It is what the flight_controller mod
; shakes against: raise it for more prop wash. 0 = steady thrust.
wash=1.0

; An added prop-wash shake in that wake: a small, fast attitude jitter
; (about 25 times a second, 1.5 degrees at the worst of it at 1), sized by
; feel. Off by default: with the flight_controller mod on, the real thing
; comes from the flight controller fighting the uneven thrust, and without
; it the jitter looks more like a glitch than air. 0 = none.
shake=0.0

; More thrust with the floor under the props (up to 20%, within five prop
; radii) - and a push to level when one side is lower. 0 = none.
ground_effect=1.0

; The props pulled up towards a ceiling (up to 60%, within two prop
; radii). 0 = none.
ceiling_effect=1.0
