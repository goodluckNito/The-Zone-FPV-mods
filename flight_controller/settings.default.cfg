; flight_controller 1.0 - settings.
; Change a value, save, restart the game. Delete a line to use the default.
; Updates keep what you change here (settings.default.cfg has the defaults).
; flight_controller/status.txt shows whether it is in effect and the drone in use.

[mod]

; flight_controller is off until you set this to true.
enabled=false

[flight_controller]

; Betaflight's airmode: the throttle is moved as far as needed to keep full
; control of the attitude, even at zero throttle (motors speed up to turn
; the quad) or full throttle (some slow down). false = the motors clip.
airmode=true

; Until the throttle first goes past this (percent) after arming, the I term
; is held at zero while the throttle is low, so the quad cannot wind itself
; up sitting on the ground (Betaflight's airmode_start_throttle_percent).
airmode_start_throttle_percent=25

; Motor idle, percent of full output while armed (Betaflight's
; dshot_idle_value, 550 = 5.5%).
idle_percent=5.5

; TPA: D is cut by this many percent from the breakpoint (in Betaflight's
; 1000-2000 throttle units) to full throttle.
tpa_rate=65
tpa_breakpoint=1350

; The D term's low-pass filter and the feedforward's smoothing (Hz).
dterm_lowpass_hz=100
feedforward_smoothing_hz=30

; The limit of the I term (Betaflight's iterm_limit).
iterm_limit=400

; true = the ESCs brake the motors as they slow them (BLHeli_S, Bluejay,
; AM32), so they slow down as quickly as they speed up. false = they coast
; down, 4 times slower.
braking=true

; The quad's grip on the ground - how hard it is to slide or spin it there.
; The game's is 1.0, like rubber on concrete, which holds a quad yawing on
; its own props' torque still until it is nearly off the ground; plastic
; ducts and frames slide more like 0.3-0.5. Lower = it yaws and skids on the
; ground more easily (and slides further after a crash).
ground_friction=0.5

;; ---- PIDs ----
; P, I, D and F for each axis, in Betaflight's own units: paste a tune. The
; 5inch profile is Betaflight 4.5's defaults; the whoop profile is BETAFPV's
; Air65 II freestyle tune. Each drone below says which it uses.

[pids_5inch]
roll_p=45
roll_i=80
roll_d=40
roll_f=120
pitch_p=47
pitch_i=84
pitch_d=46
pitch_f=125
yaw_p=45
yaw_i=80
yaw_d=0
yaw_f=120

[pids_whoop]
roll_p=49
roll_i=79
roll_d=38
roll_f=35
pitch_p=59
pitch_i=95
pitch_d=52
pitch_f=43
yaw_p=49
yaw_i=79
yaw_d=0
yaw_f=35

;; ---- Drones ----
; Each of the game's quads: yaw_torque (a prop's drag torque over its
; thrust, in metres - what yaw has to work with) and its PID profile. Its
; props, frame and motors' time constant are in drones/settings.cfg,
; shared with the other mods; its weight is the game's, and its moment of
; inertia is worked out from the weight and the frame. A drone added by
; the drones mod uses the profile and yaw torque of the quad it is built on.

[65mm_freestyle]
yaw_torque=0.006
pids="whoop"

[85mm_freestyle]
yaw_torque=0.006
pids="whoop"

[2.5in_freestyle]
yaw_torque=0.008
pids="5inch"

[3.5in_freestyle]
yaw_torque=0.009
pids="5inch"

[5in_freestyle]
yaw_torque=0.011
pids="5inch"

[beginner_5_in_quad]
yaw_torque=0.011
pids="5inch"

[5in_racer]
yaw_torque=0.011
pids="5inch"

; Any other quad.
[other]
yaw_torque=0.006
pids="whoop"
