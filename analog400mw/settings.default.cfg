; analog400mw 2.0.1 - settings.
; Change a value, save, restart the game. Delete a line to use the default.
; Updates keep what you change here (settings.default.cfg has the defaults).
; analog400mw/status.txt shows what was applied on the last launch.

[mod]

; false = turn analog400mw off: the game runs as if it were not installed.
enabled=true

[tuning]

;; ---- Signal ----

; How many quality points below 100 count as a total breakup. Lower = the picture falls apart sooner.
degrade_span=55.0

;; ---- Colour hits (single frames, any range) ----

; How often a hit knocks the colour off for a frame. 1.0 = about 4 a second close in, in bursts, more with range and walls. 0 = off.
hit_rate=1.0

; How far a hit throws the colour: the hue swing, how differently light and dark areas turn, and the saturation boost. The rainbow slips stay unless this is 0.
hit_strength=1.0

; How often the picture drops to black and white for a frame or two. 0 = never.
colour_kill=1.0

;; ---- Breakups (colour bands) ----

; How often breakups happen. 1.0 = about one every 4-5 s on a good link, more with range and walls. Close in a band only shifts the colour; snow and confetti come in with range.
band_rate=1.0

; Length of a breakup time slot in seconds. Lower = shorter, snappier breakups.
band_period=0.35

; Tallest band, in scanlines. Bands grow with range.
band_rows=180.0

; Colour strength inside a band.
chroma_band=0.45

; Strength of the solid colour streaks.
band_colour=1.0

; Share of breakups that carry white snow. Lower = more colour-only bands.
snow_share=1.0

;; ---- Tearing (sideways sync hits) ----

; How far lines tear sideways when noise knocks the line sync: inside breakup bands, the odd knock on its own, and the bend at the top of the picture on a weak link. 0 = never.
warble=1.0

; How often a knock comes without a breakup band. 1.0 = about one every 8 s on a good link, two a second at the worst.
warble_rate=1.0

;; ---- Snow inside a breakup ----

; How dense the snow is.
sparkly_amount=0.8

; 0 = equal bright and dark specks, 1 = white snow.
sparkly_white=0.95

; Length of the specks.
sparkly_len=2.0

; Height of the specks, in scanlines.
sparkly_rows=1.0

; 1 = snow only inside a breakup band. Lower lets it spread over the picture.
sparkly_band=1.0

; How much the snow favours the edges of the frame.
sparkly_edge=0.3

;; ---- Edge of range ----

; Strength of the random-colour noise when the signal is bad.
confetti=1.0

; How bad the signal must be (0-1) before that noise covers the whole picture.
wash_onset=0.55

;; ---- Picture ----

; How sharp the picture is. 1.0 = as sharp as the analog link in the reference footage; 0.73 = the softer look of 1.2 and earlier; higher = crisper.
sharpness=1.0

; Lines of vertical detail the analog video carries (NTSC shows 480). Fewer = softer top to bottom; 0 = no limit.
video_lines=480.0

; Rainbow shimmer on fine patterns. 0 = none.
cross_colour=0.12

[link]

;; ---- Range ----
; How far the video reaches in the open, in metres. Flying out with nothing
; in the way, the first breakups come in at about a quarter of this and the
; picture is gone here. Walls cut it much shorter, as in the game.
; 0 = no loss in the open, only behind walls (the game's own way).
open_range=400


[camera]

;; ---- Camera ----
; While the analog feed is on, the game's 3D view is rendered at about this
; many lines, so fine and distant detail softens the way a whoop camera and
; analog video soften it. The OSD stays sharp. Fewer = softer, and faster.
; 0 = render at full resolution.
lines=480

; Smooth the jagged edges of that lower-resolution render.
antialias=true

; How soft the camera's lens is on fine texture. It also stops fine patterns
; shimmering at the lower resolution. 0 = the game's own sharpness.
texture_softness=0.5

;; ---- Glare ----
; A cheap whoop camera's lens: bright sky, sunlit walls, windows and lamps
; spill past their edges with a soft halo. 0 = off, 0.5 = half as strong,
; 2 = twice as strong.
glare=1.0

; How far the bloom spreads. 2 = twice as far.
glare_size=1.0

; Shadows next to bright areas wash out, as light scatters in a small lens.
; 0 = off.
haze=1.0

; A faint purple fringe beside bright areas, as cheap camera sensors show.
; 0 = off.
glare_tint=1.0
