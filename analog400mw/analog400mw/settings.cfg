; analog400mw 1.2 - tuning.
; Change a number, save, restart the game. Delete a line to use the default.
; analog400mw/status.txt shows what was applied on the last launch.

[tuning]

;; ---- Signal ----

; How many quality points below 100 count as a total breakup. Lower = the picture falls apart sooner.
degrade_span=55.0

;; ---- Colour hits (single frames, any range) ----

; How often a hit knocks the colour off for a frame. 1.0 = about 4 a second close in, in bursts, more with range and walls. 0 = off.
hit_rate=1.0

; How far a hit throws the colour: the hue swing, how differently light and dark areas turn, and the saturation boost. The rainbow slips stay unless this is 0.
hit_strength=1.0

; How often the picture drops to black and white for a frame or two. 0 = never.
colour_kill=1.0

;; ---- Breakups (colour bands) ----

; How often breakups happen. 1.0 = about one every 4-5 s on a good link, more with range and walls. Close in a band only shifts the colour; snow and confetti come in with range.
band_rate=1.0

; Length of a breakup time slot in seconds. Lower = shorter, snappier breakups.
band_period=0.35

; Tallest band, in scanlines. Bands grow with range.
band_rows=180.0

; Colour strength inside a band.
chroma_band=0.45

; Strength of the solid colour streaks.
band_colour=1.0

; Share of breakups that carry white snow. Lower = more colour-only bands.
snow_share=1.0

;; ---- Warble (sideways bends) ----

; How far the picture bends sideways.
warble=1.0

; How often it bends. 1.0 = about one every 11 s on a good link, more with range and walls.
warble_rate=1.0

;; ---- Snow inside a breakup ----

; How dense the snow is.
sparkly_amount=0.8

; 0 = equal bright and dark specks, 1 = white snow.
sparkly_white=0.95

; Length of the specks.
sparkly_len=2.0

; Height of the specks, in scanlines.
sparkly_rows=1.0

; 1 = snow only inside a breakup band. Lower lets it spread over the picture.
sparkly_band=1.0

; How much the snow favours the edges of the frame.
sparkly_edge=0.3

;; ---- Edge of range ----

; Strength of the random-colour noise when the signal is bad.
confetti=1.0

; How bad the signal must be (0-1) before that noise covers the whole picture.
wash_onset=0.55

;; ---- Picture ----

; Rainbow shimmer on fine patterns. 0 = none.
cross_colour=0.12
