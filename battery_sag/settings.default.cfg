; battery_sag 1.0 - settings.
; Change a value, save, restart the game. Delete a line to use the default.
; Updates keep what you change here (settings.default.cfg has the defaults).
; battery_sag/status.txt shows the pack in use.

[mod]

; false = turn battery_sag off: the game runs as if it were not installed.
enabled=true

[battery]

;; ---- Handling ----

; How much the sag changes how the quad flies: 1 = fully (more throttle to
; hover as the pack drains, weaker punches), 0 = not at all (the pack still
; drains and sags on the OSD).
sag_effect=1.0

; Betaflight's vbat_sag_compensation, 0-100: the flight controller turns the
; motors up to make up for sag, so the quad feels the same until it runs out
; of headroom. 0 = off (Betaflight's default); some whoop tunes use 100.
sag_compensation=0

; When a respawn puts in a fresh pack: "disarmed" = only if you are disarmed,
; "always", or "never". Any respawn counts - R, the radio's respawn switch -
; wherever the spawn point is (moved with S or back with X); pressing S does
; not.
new_pack_on_respawn="disarmed"

;; ---- Packs ----
; Each of the game's quads has its own pack; the one for the quad you fly is
; used, and a fresh one goes in when you change quad. In each:
;   capacity_mah        pack size
;   cells               cells in series (1 = 1S ...)
;   lihv                true = LiHV (4.35 V a cell full), false = LiPo (4.20 V)
;   full_throttle_amps  the whole quad's draw at full thrust on a fresh pack
;   idle_amps           flight controller, receiver, camera and VTX
;   resistance_mohm     a cell and its lead, at full charge; higher = more sag;
;                       0 = worked out from the capacity
; Flight times below are for lively flying (punches, then cruising) and steady
; cruising in the flight model, to 3.2 V a cell on 1S and 3.5 V on the rest.

; 65mm Whoop - 1S 300 mAh LiHV (Air65 / Meteor65 / Mobula6 class).
; About 3.5 min lively, 5 min cruising.
[65mm_freestyle]
capacity_mah=300
cells=1
lihv=true
full_throttle_amps=15.0
idle_amps=0.9
resistance_mohm=37

; 85mm Whoop - 2S 450 mAh LiHV (Mobula8 / Meteor85 class).
; About 2.5 min lively, 4.5 min cruising.
[85mm_freestyle]
capacity_mah=450
cells=2
lihv=true
full_throttle_amps=30.0
idle_amps=0.45
resistance_mohm=14

; 2.5" Freestyle - 2S 550 mAh LiHV (ultralight 2.5" class).
; About 3 min lively, 5.5 min cruising.
[2.5in_freestyle]
capacity_mah=550
cells=2
lihv=true
full_throttle_amps=36.0
idle_amps=0.45
resistance_mohm=12

; 3.5" Freestyle - 4S 850 mAh LiPo.
; About 3 min lively, 5.5 min cruising.
[3.5in_freestyle]
capacity_mah=850
cells=4
lihv=false
full_throttle_amps=55.0
idle_amps=0.35
resistance_mohm=6.5

; 5" Freestyle - 6S 1300 mAh LiPo.
; About 2 min lively, 4.5 min cruising.
[5in_freestyle]
capacity_mah=1300
cells=6
lihv=false
full_throttle_amps=147.0
idle_amps=0.3
resistance_mohm=4.3

; Beginner 5" - 4S 1500 mAh LiPo.
; About 2.5 min lively, 3.5 min cruising (a heavy quad on 4S).
[beginner_5_in_quad]
capacity_mah=1500
cells=4
lihv=false
full_throttle_amps=90.0
idle_amps=0.35
resistance_mohm=3.2

; 5" Racer - 6S 1100 mAh LiPo.
; About 2 min lively (racing), 6 min cruising.
[5in_racer]
capacity_mah=1100
cells=6
lihv=false
full_throttle_amps=170.0
idle_amps=0.3
resistance_mohm=4.1

; Any other quad - 1S 550 mAh LiHV (a 75 mm whoop, Meteor75 Pro class).
; About 4.5 min lively, 7 min cruising.
[other]
capacity_mah=550
cells=1
lihv=true
full_throttle_amps=26.0
idle_amps=0.9
resistance_mohm=20
