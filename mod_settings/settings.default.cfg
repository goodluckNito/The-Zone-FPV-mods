; mod_settings 1.0 - settings.
; Change a value, save, restart the game. Delete a line to use the default.
; Updates keep what you change here (settings.default.cfg has the defaults).
; mod_settings/status.txt lists the mods found and what each change did.

[mod]

; false = turn mod_settings off: the game runs as if it were not installed.
enabled=true

[mod_settings]

; The key that opens the mods' settings over the picture while you fly (and
; closes them): a key name as Godot writes it, e.g. "F9", "F8", "Insert",
; "Home". The pause menu's Mods page is there either way.
hotkey="F9"

; How wide that overlay is, in pixels.
overlay_width=480
