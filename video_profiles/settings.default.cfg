; Visual profiles for the installed legacy analog pipeline.

[mod]
enabled=true

[video]
;; ---- Картинка ----
; "clean", "stock", "nito", "soft", "crisp", "mono".
profile="nito"
; Множитель помех выбранного профиля: 0 to 2.
noise_factor=1.0
; Множитель резкости: 0.2 to 2.
sharpness_factor=1.0
; Множитель насыщенности: 0 to 1.5.
colour_factor=1.0
; Свечение ярких областей: 0 to 2.
glare=0.6
; Мягкость текстур: 0 to 1.5.
softness=0.5

;; ---- Сигнал ----
; Автоматическое ухудшение от расстояния и препятствий.
auto_signal=true
; Для сравнения помех отключи автоматический сигнал: 0 to 100.
quality=85.0
; Минимальное качество автоматического сигнала: 0 to 100.
minimum=25.0
; Расстояние для добавочной потери сигнала в метрах: 0 to 2000.
range=400.0
