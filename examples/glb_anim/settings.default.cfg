; glb_animations - settings.
; Change a value, save, restart the game. Delete a line to use the default.

[mod]

; false = turn glb_animations off: the game runs as if it were not installed.
enabled=true

[glb_animations]

; true = every animation in a custom map loops; false = each plays once.
loop=true

; 1 = the speed they were made at.
speed=1.0

; true = looping animations are set by the clock, so everyone in a
; multiplayer race sees the same part of each loop.
sync_to_clock=true
