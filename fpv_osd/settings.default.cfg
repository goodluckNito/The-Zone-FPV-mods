; fpv_osd 1.2 - settings.
; Change a value, save, restart the game. Delete a line to use the default.
; Updates keep what you change here (settings.default.cfg has the defaults).
; fpv_osd/status.txt shows what was applied on the last launch.

[mod]

; false = turn fpv_osd off: the game runs as if it were not installed.
enabled=true

[osd]

;; ---- On-screen display ----
; Drawn into the picture before the game's video effect, so with an analog
; mode on (analog400mw's or the game's own) it breaks up with the video.

; Whose OSD it looks like. Each part further down - horizon, sidebars,
; crosshair, sticks - can also have its own: Betaflight's, BrainFPV's or
; INAV's, mixed as you like.
;   "betaflight" - a Betaflight flight controller's OSD chip: everything made
;                  of font characters, updated about 15 times a second.
;   "brainfpv"   - a BrainFPV RADIX running Betaflight: the same text, but
;                  the whole OSD redrawn 30 times a second, and its own
;                  drawn crosshair, pitch-ladder horizon and stick overlay
;                  for the parts left on "auto".
; Any of BrainFPV's drawn parts turned on also makes the OSD redraw 30 times
; a second.
style="betaflight"

; A Betaflight font (.mcm) from the fonts folder: betaflight_default.mcm,
; betaflight_large.mcm or betaflight_bold.mcm (BrainFPV offers the same
; three). Any Betaflight .mcm works - save one from Betaflight Configurator's
; font manager (or your quad's own), drop it in the fonts folder and put its
; file name here.
font="betaflight_default.mcm"

; The font for INAV's parts (its horizon, sidebars, crosshairs, HUD and the
; other INAV elements below), which are INAV's own characters: an INAV .mcm
; from the fonts folder (INAV Configurator's analogue fonts all work).
inav_font="inav_default.mcm"

; Shown at the bottom centre, like Betaflight's craft name. Empty = off.
; A drone added by the drones mod with a craft_name of its own shows that instead.
craft_name=""

;; ---- Battery ----

; Voltage shown. "cell" = the average per cell, as most pilots set it up
; (Betaflight's "average cell voltage" element): 4.20 V full, 4.35 on LiHV,
; about 3.5 to land, whatever the pack. "total" = the whole pack's
; (Betaflight's "battery voltage"), e.g. 25.2 V for a full 6S.
battery_voltage="cell"

; The next four are a fallback, used only when the battery_sag mod is not
; installed: then the readout is for show only, a pack drained and sagged by
; throttle that does not change how the quad flies. With battery_sag
; installed (status.txt says "battery: from battery_sag") the OSD shows
; battery_sag's pack for whichever quad you fly - set packs up per quad in
; battery_sag/settings.cfg - and these four do nothing. A drone added by
; the drones mod brings its own battery_mah, battery_cells and battery_lihv
; in place of the first three while you fly it.

; Pack size in mAh.
battery_mah=450

; Number of cells in series (1 = 1S, 2 = 2S ...).
battery_cells=1

; true = LiHV (4.35 V a cell full), false = regular LiPo (4.20 V).
battery_lihv=true

; When a respawn puts in a fresh pack: "disarmed" = only if you are disarmed,
; "always", or "never".
new_pack_on_respawn="disarmed"

;; ---- Battery warnings ----
; As Betaflight does it: the voltage shown and warned on is smoothed over
; about half a second, so a quick punch does not set a warning off but a long
; one on a tired pack can. The voltage readout blinks while LOW BATTERY or
; LAND NOW is up. Betaflight's setting names are in brackets; Betaflight
; writes 3.50 V as 350, and either way works here.

; LOW BATTERY below this many volts a cell (vbat_warning_cell_voltage).
; 0 = no voltage warning.
low_battery_voltage=3.50

; LAND NOW below this many volts a cell (vbat_min_cell_voltage). 0 = off.
land_now_voltage=3.30

; Seconds the voltage has to stay below before LOW BATTERY / LAND NOW comes
; up (vbat_duration_for_warning and vbat_duration_for_critical, in tenths of
; a second there). 0 = straight away.
low_battery_delay=0.0
land_now_delay=0.0

; A 1S whoop sags a lot on a punch, so with the levels above LOW BATTERY
; flickers from the first minute. For a 1S whoop flown hard, 3.30 and 3.10
; with both delays at 2 brings LOW BATTERY up about a minute before a 3.2 V
; landing and LAND NOW right at it.

; Or warn on QUICKSILVER's fuel gauge (see show_fuel_gauge below) instead of
; the voltage shown, as QUICKSILVER's own low-battery warning does: the sag
; from the throttle is added back, so punches do not set LOW BATTERY or LAND
; NOW off and a pack that is really low still does. QUICKSILVER warns at 3.60
; V a cell. The gauge does not have to be shown for this.
warnings_use_fuel_gauge=false

; LOW BATTERY also once only this many percent of the pack's mAh are left,
; and LAND NOW at 0% (use_cbat_alerts with cbat_alert_percent, 10 in
; Betaflight). 0 = off.
low_battery_percent=0

; OVER CAP once this many mAh are used, and the mAh readout blinks
; (osd_cap_alarm). 0 = off.
over_cap_mah=0

; The flight timer blinks from this many minutes, e.g. 3.5 (the timer alarm
; in Betaflight's OSD tab). 0 = off.
timer_alarm=0.0

;; ---- Elements ----

; Which elements to show. lq is link quality (0-100); rssi is the receiver's
; signal strength in dBm; current is the pack's draw in amps. The flight
; timer restarts on every respawn.
show_lq=true
show_rssi=false
show_timer=true
show_battery=true
show_mah=true
show_current=false
show_throttle=false
show_speed=false
show_altitude=false
show_warnings=true

; QUICKSILVER's fuel gauge (a whoop firmware's): the voltage with the sag from
; the throttle added back, so it holds steady through punches and falls as the
; pack drains - how much is left, where the voltage shown is how hard you are
; working the pack. It learns how much the pack sags as you fly, above 10%
; throttle, so for about the first half minute it reads close to the voltage
; shown. It learns up to 1.2 V of sag at full throttle, as QUICKSILVER does:
; enough for a whoop or a toothpick, less than a big pack sags. Shown after
; the throttle, a cell or the whole pack as battery_voltage is set, with a
; little gauge.
show_fuel_gauge=false

;; ---- Control link ----
; The game has one radio link, the video. A real quad has a second one for
; the sticks, and on most it reaches much farther than analog video. These
; set where the OSD's link quality (lq) and RSSI, the RXLOSS warning and the
; link stats come from.
;   "elrs"  - its own control link, worked out like ExpressLRS 2.4 GHz at
;             250 Hz: from the distance to where you stand and the walls in
;             between. It stays at 100 while the analog picture breaks up;
;             RXLOSS only comes far out or deep behind buildings.
;   "video" - follows the game's video signal (fpv_osd 1.8 and before).
rc_link="elrs"

; The control link's transmit power in mW (ExpressLRS radios: 10 to 1000).
; Each 4x the power is 6 dB more, about twice the range.
rc_power=100

;; ---- Stick overlay ----

; Your sticks drawn into the OSD, one for each hand. While they show, the
; game's own stick overlay is hidden (it can also be switched off in the
; game's settings).
show_sticks=false

; Which one (INAV has none):
;   "brainfpv"   - BrainFPV's (brainfpv_sticks_display): a cross for each
;                  stick with a square where the stick is, drawn pixel by
;                  pixel and redrawn 30 times a second, so it moves smoothly.
;   "betaflight" - Betaflight's (the stick overlay elements): a box of font
;                  characters with a dot that moves in steps - seven across,
;                  fifteen up and down - about 15 times a second.
;   "auto"       - style's own.
sticks_style="brainfpv"

; Radio mode, which stick moves what (osd_stick_overlay_radio_mode):
;   1 = left: pitch and yaw, right: throttle and roll
;   2 = left: throttle and yaw, right: pitch and roll (the usual)
;   3 = left: pitch and roll, right: throttle and yaw
;   4 = left: throttle and roll, right: pitch and yaw
sticks_mode=2

; brainfpv: how big, where 1.0 is the size of the game's own stick overlay
; (BrainFPV's own are about 1.5 at 1080p, 2 at 1440p). And where the middle
; of each goes, in percent of the picture: sticks_x in from its side,
; sticks_y up from its bottom. BrainFPV puts them at 8.5 and 12.5, over the
; bottom row; 17 keeps them just above the battery and mAh.
sticks_size=1.0
sticks_x=9
sticks_y=17

; betaflight: their top row (0-8; they are 5 rows tall - 6 puts them just
; below the middle), and how many columns in from each side (0-8). With the
; horizon sidebars on too, 0 keeps them from touching.
sticks_row=6
sticks_inset=1

;; ---- Crosshair and horizon ----

; A crosshair in the middle of the picture:
;   "off"
;   "auto"       - style's own: Betaflight's or BrainFPV's
;   "betaflight" - Betaflight's, from the font (a custom font's own shows)
;   "brainfpv"   - BrainFPV's: two wings and a fin, drawn
;   "inav"       - INAV's (osd_crosshairs_style DEFAULT), from inav_font;
;                  "inav_aircraft" and "inav_type3" to "inav_type8" are its
;                  others
;   "plus", "gap" (a plus with a gap in the middle), "cross", "dot",
;   "circle" or "chevron" - drawn white with a black edge like the font
;   "image"      - a .png of your own (crosshair_image), in its own colours
;                  and see-through where the picture is
crosshair="off"

; Its size: 1.0 as drawn, 2.0 twice as big. An image at 1.0 is as many
; pixels tall as the .png on a 1080p picture.
crosshair_size=1.0

; For crosshair="image": the .png, in the crosshairs folder (put your own
; there) or the fpv_osd folder. Its own colours and see-through parts show,
; drawn sharp at the screen's resolution. reticle.png, cross.png and dot.png
; come with it.
crosshair_image="crosshairs/reticle.png"

; How solid the crosshair is: 1.0 as drawn, 0.5 half see-through, 0 gone.
crosshair_opacity=1.0

; Move it up (or down, negative) by this percent of the picture's height -
; e.g. to where the quad is heading at speed, which with camera uptilt is
; below the middle.
crosshair_offset=0

; An artificial horizon: a line that tilts and moves with the quad's roll
; and pitch.
show_horizon=false

; Whose:
;   "betaflight" - Betaflight's: nine characters across the middle, level
;                  within each in ninths of a row. It stops at a steep bank.
;   "brainfpv"   - BrainFPV's pitch ladder: rungs every 10 degrees around the
;                  crosshair, numbered, dashed below the horizon, drawn.
;   "inav"       - INAV's: a line of characters through the crosshair, 11
;                  across and 9 up and down, that turns to upright
;                  characters past 45 degrees of bank, so it never breaks
;                  up. From inav_font.
;   "auto"       - style's own.
horizon_style="auto"

; The pitch, in degrees, at which the horizon reaches the end of its travel
; (osd_ah_max_pit; INAV's osd_ahi_max_pitch), and the roll for Betaflight's
; (osd_ah_max_rol).
horizon_max_pitch=20
horizon_max_roll=40

; Turn the horizon's movement the other way round: Betaflight's roll and
; pitch (osd_ah_invert), INAV's roll only (osd_ahi_reverse_roll).
horizon_invert=false

; INAV's: past this many degrees of pitch, the line shown is the one for
; that many degrees, then twice as many and so on, its ends bent the way you
; are climbing or diving - a pitch ladder of one rung at a time
; (osd_ahi_pitch_interval). 0 = off, up to 30.
horizon_pitch_interval=0

; Sidebars: ladders either side of the middle with level marks, to read the
; horizon line against.
show_horizon_sidebars=false

; Whose: "betaflight" (seven rows, still), "inav" (INAV's, which can scroll)
; or "auto" (Betaflight's; BrainFPV uses them too).
sidebars_style="auto"

; INAV's: what each one scrolls with, as a tape does: "none", "altitude",
; "speed" or "home_distance" (osd_left_sidebar_scroll,
; osd_right_sidebar_scroll); an arrow above or below for which way it is
; going (osd_sidebar_scroll_arrows); and how many rows up and down, 0-5
; (osd_sidebar_height, 0 leaves just the level marks).
sidebars_scroll_left="none"
sidebars_scroll_right="none"
sidebars_arrows=false
sidebars_height=3

; true = allow for the camera's uptilt, read from the quad you are flying,
; so each preset's own camera angle counts. Betaflight's and BrainFPV's are
; then put where the real horizon is in the picture, at any attitude (their
; max pitch, roll and invert do nothing); INAV's does as INAV does
; (osd_ahi_camera_uptilt_comp): its pitch less the camera's uptilt, so it is
; on the real horizon when the camera looks level. false = as the firmware
; draws it by default: the quad's attitude, level in the middle of the screen
; whatever the camera's tilt, so with uptilt it sits above the real horizon
; when you hover.
horizon_uptilt=false

; BrainFPV's pitch ladder: how many rungs each way, 0-9
; (brainfpv_osd_ahi_steps); 2 shows up to 20 degrees. 0 = just the horizon
; line, with a gap in the middle - with horizon_uptilt, a thin line on the
; real horizon and nothing else.
horizon_steps=2

; BrainFPV's scales. Each is a ruler down one side of the picture that
; scrolls as the value changes, with the value boxed in the middle: altitude
; above where you armed, in metres, on the right; speed in km/h on the left
; (brainfpv_altitude_scale, brainfpv_speed_scale). A BrainFPV shows the
; altitude one with a barometer or GPS on the quad, the speed one only with
; GPS.
show_altitude_scale=false
show_speed_scale=false

;; ---- Compass and home ----
; What a GPS quad shows. Home is the spawn point - where you respawn - and
; moves the moment you move the spawn (S, X).

; A compass along the top: nine characters, 22.5 degrees each, the way the
; quad faces in the middle; north is the game world's -z (Betaflight's compass
; bar - INAV's heading graph is the same nine characters).
show_compass=false

; Betaflight's home arrow and distance, top middle: the arrow points home
; as seen from the quad.
show_home=false

;; ---- Flip arrow and up/down (Betaflight) ----

; An arrow above the warnings pointing the way to flip the quad back over
; (Betaflight's flip arrow): while the game's turtle mode is on, or while
; disarmed and more than 25 degrees off level.
show_flip_arrow=false

; A U or a D where straight up or straight down is, while the nose points
; within about 25 degrees of it - in a vertical climb or dive (Betaflight's
; up/down reference). On the crosshair when straight up or down is dead
; ahead, off it the way it lies. Betaflight goes by the quad, so with a
; tilted camera it is off by the tilt; with horizon_uptilt=true it goes by
; the camera.
show_up_down=false

;; ---- HUD (INAV) ----
; INAV's head-up display (osd_hud_*), in INAV's characters from inav_font.
; Markers go where the thing really is in the picture; out of it, to the
; side it is round, with arrows.

; An H on home, with its distance under it (osd_hud_homepoint).
hud_homepoint=false

; Arrows round the crosshair pointing home: left or right, more of them the
; further round it is, and up or down while it is ahead (osd_hud_homing).
hud_homing=false

; Other players' quads, 0-4 of the nearest, as INAV shows other aircraft
; from its radar: A, B, C, D with which way each is heading and where it is
; round you, and under it its height above or below you and its distance,
; three seconds each (osd_hud_radar_disp). Only those this many metres out
; (osd_hud_radar_range_min and _max).
hud_radar=0
hud_radar_range_min=3
hud_radar_range_max=4000

; How many columns (0-4) and rows (1-3) in from the edges the markers stay
; (osd_hud_margin_h, osd_hud_margin_v).
hud_margin_h=3
hud_margin_v=3

;; ---- More from INAV ----
; INAV's own elements, at INAV's places for them, from inav_font.

; Its vario: a column of arrows right of the middle, one for every 0.5 m/s
; you climb or sink (osd_vario), and its vertical speed in m/s beside it.
show_vario=false
show_vario_number=false

; Its g-force readout, above the middle; it blinks above g_force_alarm g
; (osd_gforce_alarm).
show_g_force=false
g_force_alarm=5.0

; Its throttle gauge: a column that fills from the bottom, left of the middle.
show_throttle_gauge=false

; The OSD shows whatever the game's Signal Simulation is set to - Off, the
; digital modes or Analog - so turning the analog video off leaves the OSD on.
; false = only with analog video.
show_in_digital=true

; Hide the game's grey message box ("DISARMED", "Press R to reset, T to flip
; over") while the OSD is showing; the OSD's own warnings, DISARMED included,
; stand in for it.
hide_game_messages=true

;; ---- Post-flight stats ----
; Betaflight's stats screen: disarm after a flight and the OSD clears and
; shows the flight's numbers. They go after 60 s, when you arm again, or when
; you push the throttle or the pitch stick more than halfway up, as in
; Betaflight. Disarming needs an arm switch set up in the game's controller
; settings; without one the quad is always armed - see stats_on_respawn.

; true = show the stats screen, false = never.
stats=true

; Also show it when you respawn (R) after flying. Useful without an arm
; switch; with the quad still armed it clears as you take off.
stats_on_respawn=false

; Which lines show - always in Betaflight's order, up to 13. Betaflight's
; label for each is in brackets.

; (date and time) The computer's clock at the end of the flight.
stat_date_time=false
; (ON TIME) Time since the pack went in.
stat_on_time=false
; (TOTAL ARM) Time armed - the flight timer.
stat_armed_time=true
; (MAX ALTITUDE) Highest above where you armed.
stat_max_altitude=false
; (MAX SPEED) km/h.
stat_max_speed=true
; (MAX DISTANCE) Furthest from where you armed.
stat_max_distance=false
; (FLIGHT DISTANCE) Distance flown.
stat_flight_distance=false
; (MIN BATTERY) Lowest voltage while armed (the smoothed one, as shown).
stat_min_battery=true
; (END BATTERY) Voltage when the flight ended.
stat_end_battery=false
; (BATTERY) Voltage now, as the pack recovers.
stat_battery=false
; (MIN RSSI) Lowest signal strength, in %.
stat_min_rssi=false
; (MAX CURRENT) Highest current draw.
stat_max_current=true
; (USED MAH) mAh used from the pack.
stat_used_mah=true
; (MAX G-FORCE) Highest g-force, as the flight controller's accelerometer
; would read it (crashes included).
stat_max_g_force=false
; (MIN LINK) Lowest link quality.
stat_min_link_quality=true
; (MIN RSSI DBM) Lowest signal strength in dBm.
stat_min_rssi_dbm=false
; (TOTAL FLIGHTS) Flights of 10 s or more, counted since these went on and
; kept in fpv_osd/totals.cfg (delete it to start again).
stat_total_flights=false
; (TOTAL FLIGHT TIME) Hours:minutes armed over all of them.
stat_total_time=false
; (TOTAL DISTANCE) km flown over all of them.
stat_total_distance=false
; (USED WATT HOURS) Energy used from the pack.
stat_watt_hours=false
; (100% THRT TIME) Time at full throttle.
stat_full_throttle_time=false
; (100% THRT COUNT) Times you went to full throttle.
stat_full_throttle_count=false
; (AVG THROTTLE) Average throttle, in %.
stat_avg_throttle=false

; The battery lines per cell, like the readout above (true), or for the whole
; pack (false) (osd_stat_avg_cell_value).
stat_cell_voltage=true
