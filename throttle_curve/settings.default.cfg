; throttle_curve 1.0 - settings.
; Change a value, save, restart the game - or change it in Pause > Mods with
; mod_settings (or F9 while flying): the curve changes at once. Delete a line
; to use the default. Updates keep what you change here (settings.default.cfg
; has the defaults). throttle_curve/status.txt shows the curve in effect.

[mod]

; false = turn throttle_curve off: the game runs as if it were not installed.
enabled=true

[throttle_curve]

; The throttle your quad needs to hover, in percent (5 to 95). Fly it level
; at a steady hover and read the throttle off the OSD or the stick overlay;
; a 5" with a lot of thrust hovers near 30, a floaty whoop nearer 50.
; With the defaults (50 and 50) the throttle is the game's own, untouched.
hover_percent=50.0

; Where on the throttle stick you want that hover to sit, in percent (5 to
; 95): 50 = the middle of the stick, so the hover is always at the middle
; whatever the drone's thrust. Put it equal to hover_percent to leave the
; hover where the game has it and only shape the feel around it.
; (Betaflight's thr_mid; hover_percent is its thr_hover.)
hover_stick_percent=50.0

; Throttle expo, in percent (0 to 100): flattens the stick around the hover
; point so small movements change the throttle less, and steepens it towards
; the ends. 0 = a straight line each side of the hover; 100 = as flat as the
; curve goes. Betaflight's thr_expo: the same curve.
expo_percent=0.0
