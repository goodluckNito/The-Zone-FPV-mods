; mode_3d 1.0 - settings.
; Change a value, save, restart the game - or change it in Pause > Mods with
; mod_settings (turning the mod on or off takes a restart; the rest changes
; at once). Delete a line to use the default. Updates keep what you change
; here (settings.default.cfg has the defaults). mode_3d/status.txt shows
; whether it is in effect.

[mod]

; mode_3d is off until you set this to true.
enabled=false

[mode_3d]

; How the throttle drives motors that turn both ways:
;   "centre" - Betaflight's 3D mode: the middle of the stick is zero. Above
;              it the props push as usual, below it they turn backwards and
;              push the other way, harder the further you go. Arm with the
;              throttle at the middle (the game's arm switch); without an
;              arm switch, the motors wait at idle until the throttle has
;              been to the middle. Easiest with a throttle stick that
;              springs back to the middle.
;   "switch" - Betaflight's 3D on a switch: the throttle works as usual (low
;              is idle) and the switch you have set for the game's turtle
;              mode turns the motors round. The game's own turtle mode is
;              off meanwhile - you don't need it.
throttle="centre"

; Centre: how much of each half of the stick, next to the middle, is still
; zero (Betaflight's 3d_deadband_throttle: 50 of 500 is 10 percent). Arming
; needs the throttle in it.
deadband_percent=10.0

; What props turning backwards push, against turning forward at the same
; speed, for the same power: 0.73 for normal props (a bench test of a 7x5
; tri-blade: 0.59 against 0.81 kgf at full throttle), about 1.0 for
; symmetrical 3D props.
reverse_thrust=0.73

; Turning round, an ESC brakes the motor until it can no longer follow it,
; then starts it again the other way, with limited power: how long the
; motor stands stopped (ms). Through zero the props push nothing for this
; long and a little more, and the quad drops or floats meanwhile.
reverse_ms=40.0
