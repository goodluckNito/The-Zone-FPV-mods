; prop_damage 1.0 - settings.
; Change a value, save, restart the game - or change it in Pause > Mods with
; mod_settings. Delete a line to use the default. Updates keep what you
; change here (settings.default.cfg has the defaults). prop_damage/status.txt
; lists each prop hit.

[mod]

; prop_damage is off until you set this to true.
enabled=false

[prop_damage]

; How tough the props are: 2 = they take twice the hits, 0.5 = half. Props
; in ducts (the whoops) take a sixth of the damage whatever this is.
durability=1.0

; true = a very hard hit with the props spinning, or any hit on a prop
; already worn right through, can break a prop off: that corner gives no
; thrust, and the quad usually goes down. false = props chip and wear but
; never break off.
breaking=true

; In the game the tips of the props stick out past the quad's collision
; shape (by about a third of their length on the 5"), so clipping a pole,
; a gate or a branch with them goes straight through. true = those clips
; count as hits too: a chip off the prop, and a kick to the quad.
tip_strikes=true

; How hard a clipped tip kicks the quad: the thing hit pushes the blade back
; against its spin - a shove and a yaw twitch, about 150 degrees a second
; for a clip at full throttle at 1. 0 = no kick (the damage still counts).
kick=1.0

;; ---- What damage does ----

; The thrust a worn prop loses (its blade tips make most of its thrust): 1 =
; up to 35% for a prop worn right through. 0 = none.
thrust_loss=1.0

; How much a damaged prop - out of balance - shakes the quad: the camera,
; the gyro (with flight_controller, its D term turns that into twitchy, busy
; motors) and, with pilot_audio, a rough motor sound. 0 = none.
vibration=1.0

;; ---- On screen ----

; The quad you fly seen from above on screen (front at the top, its props
; where they are - in their ducts on a whoop), showing which props are
; damaged and how badly, and which was just hit.
;   "auto"   - with fpv_osd, drawn into its OSD in the OSD's own look: white
;              outlined in black, through the video effect like the rest of
;              the OSD; each prop a ring that fills in white as it wears
;              (a quarter filled = 25% worn), a broken ring with an X for one
;              broken off, and a prop just hit blinking. Without fpv_osd (or
;              while its OSD is not showing), as "colour".
;   "colour" - in colour, over the game (not in the video picture), even with
;              fpv_osd: each prop's blades going from white through yellow to
;              red as it wears, a red X for one broken off, and a prop just
;              hit flashing.
;   "off"    - not shown (fpv_osd's warnings and show_props, and show_damage
;              below, still can).
display="auto"

; Where its middle is, across the picture from the left (0) to the right
; (1), and down it from the top (0) to the bottom (1).
display_x=0.9
display_y=0.6

; Its size: 1 = about a fifth of the picture's height, 2 = twice that.
display_size=1.0

; How solid it is: 1 = solid, 0.5 = half see-through, 0 = not shown.
display_opacity=0.85

; true = only once a prop is damaged (new props: nothing on screen). false =
; always while flying.
display_only_damaged=true

;; ---- New props and the OSD ----

; true = every respawn puts new props on. false = only picking a drone
; (or restarting the game) does.
fresh_props_on_respawn=true

; true = a line in the game's grey message box when a prop is damaged or
; breaks, for a couple of seconds. With fpv_osd, which hides that box, the
; hit shows in its warnings instead (its show_prop_damage and show_props).
show_damage=true
