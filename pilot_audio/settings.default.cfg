; pilot_audio 1.0 - settings.
; Change a value, save, restart the game. Delete a line to use the default.
; Updates keep what you change here (settings.default.cfg has the defaults).
; pilot_audio/status.txt shows what was applied on the last launch.

[mod]

; false = turn pilot_audio off: the game runs as if it were not installed.
enabled=true

[audio]

;; ---- The pilot ----
; The pilot stands at the spawn point - the same spot the game's analog video
; link is measured from - facing the way the spawn faces. The game's S key
; moves the spawn to where the quad is (X puts it back), and the pilot goes
; with it.

; Head height above the spawn point, in metres.
pilot_height=1.7

; Turn the pilot from the spawn's direction, in degrees: 90 = face right,
; -90 = face left, 180 = face back. Only changes left and right.
facing_offset=0

;; ---- Loudness ----

; Within this many metres the quad is as loud as the game plays it.
full_volume_distance=3.0

; How fast it fades with distance. 1.0 = real (6 dB quieter each time the
; distance doubles: 20 dB down at 30 m, 30 dB at 100 m); 0.5 = half as fast,
; to hear it further out; 0 = no fading.
falloff=1.0

; Never quieter than this, in dB. -60 = fades out for real; -30 keeps a faint
; buzz however far away.
quietest_db=-60

;; ---- Effects ----

; The air soaks up high frequencies over distance: duller the further away.
air=true

; Something between you and the quad (a building, a hill) makes it quieter and
; duller, like hearing it round a corner.
walls=true

; How much quieter behind a wall, in dB.
wall_db=10

; Sound takes a moment to reach you (0.3 s from 100 m), and the pitch rises
; as the quad comes towards you and drops as it goes away (doppler).
delay_and_doppler=true

; Left and right by where the quad is against the way the pilot faces, a
; little duller when it is behind you.
stereo=true

; How far to the side a quad off to your right or left sounds: 1.0 = right
; in that ear, 0.5 = halfway.
stereo_width=0.8

;; ---- Other players ----

; In multiplayer, give other players' quads a motor sound, heard the same way
; (the game has none for them). Their motor speed comes from their throttle;
; a quad sat still at zero throttle goes quiet, as the game does not say
; whether it is armed.
multiplayer=true

; At most this many of them, the nearest. When more are about, one being
; heard gives way only to one at least 20% nearer, and they fade in and out
; as they swap. Each costs a little CPU; 16 covers a full lobby.
multiplayer_max=8

; Silence the other players' quads while the game window is in the
; background, as the game does your own.
mute_in_background=true
