; throttle_fix 1.0 - settings.
; Change a value, save, restart the game.
; throttle_fix/status.txt shows what it did on the last launch.

[mod]

; false = turn throttle_fix off: the game runs as if it were not installed.
enabled=true

[throttle_fix]

; Nothing else to set: until your radio reports the throttle, the game reads
; it as all the way down (see README.txt).
